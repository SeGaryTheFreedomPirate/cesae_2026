<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercício Bootstrap - Sistema de Grid</title>
    <!-- CSS do Bootstrap v5.3 -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container mx-auto">
      
      <!-- 1ª Row: 6 colunas no PC (md) e 12 colunas em ecrãs pequenos -->
      <div class="row mb-4 mx-auto">
        <div class="col-12 col-md-6 bg-primary text-white text-center p-3">
          Joel
        </div>
      </div>

      <!-- 2ª Row: Bloco central de 8 colunas com frase e fundo verde -->
      <div class="row justify-content-center mx-auto">
        <div class="col-12 col-md-8 bg-success text-white text-center p-3">
          Programação
        </div>
      </div>

    </div>
  </body>
</html>
